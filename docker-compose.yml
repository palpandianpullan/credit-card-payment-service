version: '3.8'

services:
  payment-api:
    build: .
    container_name: credit-card-payment-api
    ports:
      - "9090:9090"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9090/credit-card-payment-api/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - reservation-network

networks:
  reservation-network:
    external: true
