# Server Configuration
server.port=9090
server.servlet.context-path=/credit-card-payment-api

# Application Name
spring.application.name=credit-card-payment-api

# Logging Configuration
logging.level.root=INFO
logging.level.com.creditcard.paymentapi=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Mock Payment Configuration
# Comma-separated list of payment references that should be CONFIRMED
payment.mock.confirmed=DL123456789,REF001,REF002,REF003
# Comma-separated list of payment references that should be REJECTED
payment.mock.rejected=REJECT001,REJECT002
